name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # The same 22 the check workflow pins. This job only builds, so
          # 20 happened to work — but two workflows disagreeing about the
          # runtime is how a deploy starts failing for a reason that has
          # nothing to do with the commit that triggered it.
          node-version: 22
          # Almost the whole deploy was one step: npm ci ran 3-6 minutes
          # against a cold runner while checkout, build, upload and the
          # deploy itself took about fifteen seconds between them. This
          # keeps ~/.npm between runs, keyed on the lockfile, so the
          # install reads from disk instead of the network.
          cache: npm
      - run: npm ci --prefer-offline --no-audit --fund=false
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
