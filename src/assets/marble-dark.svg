<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 200" preserveAspectRatio="xMidYMid slice">
  <!-- The same stone at night: the white ground becomes graphite and the
       pour becomes an ember, so the type sitting on it stays legible
       without the band changing its shape. Pairs with marble-light.svg. -->
  <defs>
    <linearGradient id="d-stone" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#101014"/>
      <stop offset="0.5" stop-color="#191920"/>
      <stop offset="1" stop-color="#22222a"/>
    </linearGradient>
    <linearGradient id="d-pour" x1="0.1" y1="1" x2="0.95" y2="0">
      <stop offset="0" stop-color="#7a2c00"/>
      <stop offset="0.42" stop-color="#c24a00"/>
      <stop offset="1" stop-color="#ff8a33"/>
    </linearGradient>
    <filter id="d-flow" x="-25%" y="-60%" width="150%" height="220%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.0034 0.010" numOctaves="3" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="54" xChannelSelector="R" yChannelSelector="G"/>
      <feGaussianBlur stdDeviation="0.6"/>
    </filter>
  </defs>

  <rect width="1200" height="200" fill="url(#d-stone)"/>

  <g filter="url(#d-flow)">
    <path d="M -80 -70 H 1280 V 92 C 1050 156 950 58 790 102 C 630 146 470 56 300 50 C 190 46 55 72 -80 58 Z" fill="url(#d-pour)"/>

    <path d="M -80 66 C 90 82 250 58 400 66 C 560 74 690 118 850 108 C 990 99 1130 128 1280 104"
      fill="none" stroke="#050507" stroke-opacity="0.5" stroke-width="2.4" stroke-linecap="round"/>
    <path d="M -80 84 C 120 104 260 76 430 88 C 600 100 700 136 880 126 C 1020 118 1150 146 1280 124"
      fill="none" stroke="#050507" stroke-opacity="0.28" stroke-width="1.3" stroke-linecap="round"/>


    <!-- fine veining carried down into the white, the way the stone
         actually breaks past the pour -->
    <path d="M -80 104 C 140 96 280 124 470 118 C 660 112 790 146 980 136 C 1110 130 1200 150 1280 142"
      fill="none" stroke="#050507" stroke-opacity="0.34" stroke-width="1.1" stroke-linecap="round"/>
    <path d="M 120 118 C 300 112 420 136 600 130 C 760 125 880 152 1060 146"
      fill="none" stroke="#8f8f9c" stroke-opacity="0.2" stroke-width="0.9" stroke-linecap="round"/>
    <path d="M 640 92 C 760 88 840 110 960 106 C 1080 102 1180 118 1280 112"
      fill="none" stroke="#050507" stroke-opacity="0.34" stroke-width="1.6" stroke-linecap="round"/>
    <path d="M -80 132 C 160 118 300 152 500 146 C 700 140 830 168 1010 158 C 1130 152 1210 170 1280 164"
      fill="none" stroke="#8f8f9c" stroke-opacity="0.24" stroke-width="1.8" stroke-linecap="round"/>
    <path d="M -80 168 C 200 158 340 186 560 178 C 780 170 920 194 1120 186"
      fill="none" stroke="#8f8f9c" stroke-opacity="0.14" stroke-width="1.2" stroke-linecap="round"/>

    <ellipse cx="880" cy="30" rx="300" ry="26" fill="#ffd0a8" opacity="0.16"/>
    <ellipse cx="330" cy="14" rx="240" ry="18" fill="#ffffff" opacity="0.06"/>
  </g>
</svg>
