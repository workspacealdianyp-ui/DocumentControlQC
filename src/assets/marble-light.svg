<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 200" preserveAspectRatio="xMidYMid slice">
  <!-- Drawn to the supplied reference: white ground, orange bands with a
       chrome highlight along their crest, and black ribbons threading
       between them, all running horizontally in one flow. Pairs with
       marble-dark.svg; see .masthead in styles.css. -->
  <defs>
    <linearGradient id="l-ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.5" stop-color="#f4f4f6"/>
      <stop offset="1" stop-color="#ffffff"/>
    </linearGradient>
    <!-- an orange band is lit along its top edge and falls away under it -->
    <linearGradient id="l-band" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffb066"/>
      <stop offset="0.22" stop-color="#f97a12"/>
      <stop offset="0.6" stop-color="#e05c00"/>
      <stop offset="1" stop-color="#b23f00"/>
    </linearGradient>
    <linearGradient id="l-band2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd0a0"/>
      <stop offset="0.3" stop-color="#ff8c2b"/>
      <stop offset="1" stop-color="#cc4f00"/>
    </linearGradient>
    <linearGradient id="l-ink" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4a4a52"/>
      <stop offset="0.35" stop-color="#141418"/>
      <stop offset="1" stop-color="#05050a"/>
    </linearGradient>
    <linearGradient id="l-silver" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.45" stop-color="#d9d9e0"/>
      <stop offset="1" stop-color="#f7f7f9"/>
    </linearGradient>
    <filter id="l-soft" x="-4%" y="-30%" width="108%" height="160%">
      <feGaussianBlur stdDeviation="0.7"/>
    </filter>
  </defs>

  <rect width="1200" height="200" fill="url(#l-ground)"/>

  <g filter="url(#l-soft)">
    <!-- upper flow -->
    <path d="M-40 34 C 180 6 330 58 520 44 C 720 30 860 -4 1060 12 C 1130 18 1180 26 1240 22 L1240 60 C 1180 64 1130 56 1060 50 C 860 34 720 68 520 82 C 330 96 180 44 -40 72 Z" fill="url(#l-band)"/>
    <path d="M-40 34 C 180 6 330 58 520 44 C 720 30 860 -4 1060 12 C 1130 18 1180 26 1240 22" fill="none" stroke="#ffe0c0" stroke-width="2.5" opacity="0.85"/>

    <path d="M-40 72 C 180 44 330 96 520 82 C 720 68 860 34 1060 50 C 1130 56 1180 64 1240 60 L1240 78 C 1180 82 1130 74 1060 68 C 860 52 720 86 520 100 C 330 114 180 62 -40 90 Z" fill="url(#l-ink)"/>

    <!-- silver run under the ink -->
    <path d="M-40 90 C 180 62 330 114 520 100 C 720 86 860 52 1060 68 C 1130 74 1180 82 1240 78 L1240 104 C 1180 108 1130 100 1060 94 C 860 78 720 112 520 126 C 330 140 180 88 -40 116 Z" fill="url(#l-silver)"/>

    <!-- lower flow -->
    <path d="M-40 126 C 200 100 340 150 540 138 C 740 126 880 96 1080 110 C 1145 115 1190 121 1240 118 L1240 152 C 1190 155 1145 149 1080 144 C 880 130 740 160 540 172 C 340 184 200 134 -40 160 Z" fill="url(#l-band2)"/>
    <path d="M-40 126 C 200 100 340 150 540 138 C 740 126 880 96 1080 110 C 1145 115 1190 121 1240 118" fill="none" stroke="#ffe8d2" stroke-width="2" opacity="0.8"/>

    <path d="M-40 160 C 200 134 340 184 540 172 C 740 160 880 130 1080 144 C 1145 149 1190 155 1240 152 L1240 166 C 1190 169 1145 163 1080 158 C 880 144 740 174 540 186 C 340 198 200 148 -40 174 Z" fill="url(#l-ink)" opacity="0.9"/>
  </g>
</svg>
